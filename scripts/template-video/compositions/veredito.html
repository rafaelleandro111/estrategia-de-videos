<!doctype html>
<html
  data-composition-variables='[
    {"id":"resultado","type":"enum","label":"Resultado","default":"erro","options":[{"value":"ok","label":"Funcionou"},{"value":"erro","label":"Deu errado"}]},
    {"id":"numero","type":"number","label":"Número do nível","default":2,"min":1,"max":9,"step":1},
    {"id":"tempo","type":"string","label":"Tempo gasto","default":"22 min"},
    {"id":"comentario","type":"string","label":"Comentário","default":"parece um dinossauro de piscina"}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0A0F0B; overflow: hidden; font-family: "JetBrains Mono", monospace; color: #D8F3DC; }
        #vd-term { position: absolute; left: 80px; top: 80px; right: 80px; bottom: 80px; border: 4px solid #1F3A24; background: rgba(17,26,19,0.92); }
        #vd-bar { height: 64px; border-bottom: 3px solid #1F3A24; display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 26px; color: #8FA394; }
        .vd-dot { width: 18px; height: 18px; border-radius: 50%; background: #1F3A24; }
        #vd-dot1 { background: #39FF14; }
        #vd-body { position: absolute; left: 70px; right: 70px; top: 150px; }
        #vd-cmd { font-size: 40px; color: #8FA394; }
        #vd-stamp-wrap { margin-top: 90px; display: flex; }
        #vd-stamp { border: 14px solid var(--cor); padding: 26px 60px; }
        #vd-stamp-txt { font-family: "Archivo Black", sans-serif; font-size: 170px; line-height: 1; color: var(--cor); white-space: nowrap; }
        #vd-out { margin-top: 80px; font-size: 40px; color: #8FA394; }
        #vd-out b { color: #D8F3DC; font-weight: 700; }
        #vd-flash { position: absolute; inset: 0; background: var(--cor); opacity: 0; }
      </style>

      <div id="root" data-composition-id="veredito" data-width="1920" data-height="1080">
        <div id="vd-term">
          <div id="vd-bar"><span class="vd-dot" id="vd-dot1"></span><span class="vd-dot"></span><span class="vd-dot"></span><span id="vd-path"></span></div>
          <div id="vd-body">
            <div id="vd-cmd">&gt; testar resultado</div>
            <div id="vd-stamp-wrap"><div id="vd-stamp"><div id="vd-stamp-txt"></div></div></div>
            <div id="vd-out"></div>
          </div>
        </div>
        <div id="vd-flash"></div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes.getVariables();
          const ok = v.resultado === "ok";
          const root = document.querySelector('[data-composition-id="veredito"]');
          root.style.setProperty("--cor", ok ? "#39FF14" : "#FF3B3B");
          document.getElementById("vd-path").textContent = "agente@canal: ~/nivel-" + Math.round(v.numero);
          document.getElementById("vd-stamp-txt").textContent = ok ? "✓ FUNCIONOU" : "✗ DEU ERRADO";
          const out = document.getElementById("vd-out");
          out.textContent = (ok ? "exit 0" : "exit 1") + " · ";
          const b = document.createElement("b"); b.textContent = v.tempo; out.appendChild(b);
          if (v.comentario) out.appendChild(document.createTextNode(' · "' + v.comentario + '"'));

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#vd-stamp", { scale: 1.45, rotation: -9, opacity: 0 }, { scale: 1, rotation: -4, opacity: 1, duration: 0.28, ease: "power4.in" }, 0.15);
          tl.fromTo("#vd-flash", { opacity: 0.22 }, { opacity: 0, duration: 0.35, ease: "power2.out" }, 0.43);
          tl.fromTo("#vd-term", { x: ok ? 0 : -14 }, { x: 0, duration: 0.3, ease: ok ? "none" : "elastic.out(1.2,0.3)" }, 0.43);
          tl.fromTo("#vd-out", { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.7);
          // quadro parado: nada mexe depois de ~1,05 s
          window.__timelines["veredito"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
