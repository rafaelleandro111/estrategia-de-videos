<!doctype html>
<html
  data-composition-variables='[
    {"id":"ia","type":"string","label":"IA testada","default":"GPT 6 Astra"},
    {"id":"titulo","type":"string","label":"Título (parte branca)","default":"ELE CONSEGUE CRIAR UM"},
    {"id":"titulo_destaque","type":"string","label":"Título (parte verde)","default":"JOGO 3D?"},
    {"id":"subtitulo","type":"string","label":"Subtítulo","default":"3 níveis · do fácil ao impossível"}
  ]'
>
  <head><meta charset="UTF-8" /></head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0A0F0B; overflow: hidden; font-family: "JetBrains Mono", monospace; color: #D8F3DC; }
        #ab-ghost { position: absolute; right: -60px; bottom: -150px; font-family: "Archivo Black", sans-serif; font-size: 560px; line-height: 1; color: #39FF14; opacity: 0.06; pointer-events: none; }
        #ab-glow { position: absolute; left: 300px; top: 200px; width: 1100px; height: 700px; background: radial-gradient(closest-side, rgba(57,255,20,0.14), rgba(57,255,20,0)); }
        #ab-term { position: absolute; left: 80px; top: 80px; right: 80px; bottom: 80px; border: 4px solid #1F3A24; background: rgba(17,26,19,0.92); }
        #ab-bar { height: 64px; border-bottom: 3px solid #1F3A24; display: flex; align-items: center; gap: 14px; padding: 0 26px; font-size: 26px; color: #8FA394; }
        .ab-dot { width: 18px; height: 18px; border-radius: 50%; background: #1F3A24; }
        #ab-dot1 { background: #39FF14; }
        #ab-body { position: absolute; left: 70px; right: 70px; top: 130px; }
        #ab-cmd { font-size: 40px; color: #8FA394; white-space: pre; }
        #ab-cmd em { font-style: normal; color: #39FF14; }
        #ab-title { margin-top: 60px; font-family: "Archivo Black", sans-serif; font-size: 150px; line-height: 1.02; letter-spacing: -2px; }
        #ab-title-a, #ab-title-b { display: block; }
        #ab-title-b { color: #39FF14; }
        #ab-cursor { display: inline-block; width: 0.5em; height: 0.82em; margin-left: 12px; background: #39FF14; vertical-align: -0.06em; }
        #ab-sub { margin-top: 56px; font-size: 34px; color: #8FA394; }
      </style>

      <div id="root" data-composition-id="abertura" data-width="1920" data-height="1080">
        <div id="ab-glow"></div>
        <div id="ab-term">
          <div id="ab-bar"><span class="ab-dot" id="ab-dot1"></span><span class="ab-dot"></span><span class="ab-dot"></span><span>agente@canal: ~</span></div>
          <div id="ab-body">
            <div id="ab-cmd"></div>
            <div id="ab-title"><span id="ab-title-a"></span><span id="ab-title-b"><span id="ab-title-b-txt"></span><span id="ab-cursor"></span></span></div>
            <div id="ab-sub"></div>
          </div>
        </div>
        <div id="ab-ghost" data-layout-allow-overflow data-layout-allow-occlusion>IA</div>
      </div>

      <script>
        (function () {
          const v = window.__hyperframes.getVariables();
          const cmd = document.getElementById("ab-cmd");
          const a = document.getElementById("ab-title-a");
          const b = document.getElementById("ab-title-b");
          document.getElementById("ab-sub").textContent = "// " + v.subtitulo;

          const pre = "> agente --ia ";
          const quoted = '"' + v.ia + '"';
          const post = " --desafio";
          const cmdLen = pre.length + quoted.length + post.length;
          const bTxt = document.getElementById("ab-title-b-txt");
          const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;");

          // digitação determinística: o texto visível é função do progresso
          const typing = { c: 0, t: 0 };
          const renderCmd = () => {
            let n = Math.round(typing.c);
            const p1 = pre.slice(0, n); n -= p1.length;
            const p2 = quoted.slice(0, Math.max(0, n)); n -= p2.length;
            const p3 = post.slice(0, Math.max(0, n));
            cmd.innerHTML = esc(p1) + "<em>" + esc(p2) + "</em>" + esc(p3);
          };
          const words = (v.titulo + " | " + v.titulo_destaque).split(" ");
          const renderTitle = () => {
            const shown = words.slice(0, Math.round(typing.t));
            const cut = shown.indexOf("|");
            a.textContent = (cut === -1 ? shown : shown.slice(0, cut)).join(" ");
            bTxt.textContent = cut === -1 ? "" : shown.slice(cut + 1).join(" ");
          };
          renderCmd();
          renderTitle();

          const tl = gsap.timeline({ paused: true });
          tl.fromTo("#ab-term", { opacity: 0, scale: 0.97 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power2.out" }, 0);
          tl.fromTo("#ab-ghost", { x: 40 }, { x: -40, duration: 6, ease: "none" }, 0);
          tl.fromTo("#ab-glow", { scale: 0.9, opacity: 0.6 }, { scale: 1.08, opacity: 1, duration: 3, ease: "sine.inOut", yoyo: true, repeat: 1 }, 0);
          tl.to(typing, { c: cmdLen, duration: 1.1, ease: "none", onUpdate: renderCmd }, 0.15);
          tl.to(typing, { t: words.length, duration: 1.4, ease: "steps(" + words.length + ")", onUpdate: renderTitle }, 1.4);
          tl.fromTo("#ab-title", { y: 16 }, { y: 0, duration: 0.5, ease: "back.out(2)" }, 1.4);
          tl.fromTo("#ab-sub", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.45, ease: "expo.out" }, 3.0);
          tl.fromTo("#ab-cursor", { opacity: 1 }, { opacity: 0, duration: 0.4, ease: "steps(1)", repeat: 7, yoyo: true }, 3.0);
          window.__timelines["abertura"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
